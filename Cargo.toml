[workspace]
resolver = "3"
members = [
    "crates/ecx-core",
    "crates/ecx-chain",
    "crates/ecx-signer",
    "crates/ecx-wallet",
    "crates/ecx-split",
    "app",
    "cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

# Everything resolves to bitcoin 0.32 — see CLAUDE.md §4. A bump that splits this
# version is a breaking architectural change, not a routine update.
[workspace.dependencies]
bitcoin = "0.32"
bdk_wallet = "3.1.0"
# Must track bdk_wallet's requirement (^12.3.5). Pulling 13 gives two miniscript versions and
# type errors that look like nonsense — see CLAUDE.md §4.
miniscript = "12.3.5"
bdk_esplora = { version = "0.22.2", default-features = false, features = ["async-https-rustls", "tokio"] }
esplora-client = { version = "0.12.3", default-features = false, features = ["async-https-rustls", "tokio"] }
futures = "0.3"
# `jade` pulls reqwest, and that is correct rather than a smell: Jade has no secure element, so
# a *blind* oracle provides its anti-brute-force guarantee, and unlocking relays an encrypted
# handshake between device and oracle. The host is a dumb pipe — it never learns the PIN or any
# key. `service` (a remote signing service) stays excluded; that one really is the app phoning
# out on the signing path.
async-hwi = { version = "0.0.32", default-features = false, features = ["ledger", "coldcard", "specter", "jade"] }
trezor-client = { version = "0.1.6", features = ["bitcoin"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"

ecx-core = { path = "crates/ecx-core" }
ecx-chain = { path = "crates/ecx-chain" }
ecx-signer = { path = "crates/ecx-signer" }
ecx-wallet = { path = "crates/ecx-wallet" }
ecx-split = { path = "crates/ecx-split" }
